name: Build Dev

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ===== Windows =====
          - os: windows-latest
            goos: windows
            goarch: amd64
            platform: windows-amd64
            ext: .exe

          # ===== Linux =====
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            platform: linux-amd64
            ext: ""

          - os: ubuntu-22.04
            goos: linux
            goarch: arm64
            platform: linux-arm64
            ext: ""

          - os: ubuntu-22.04
            goos: linux
            goarch: arm
            goarm: "7"
            platform: linux-armv7
            ext: ""

          # ===== macOS =====
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            platform: darwin-amd64
            ext: ""

          - os: macos-latest
            goos: darwin
            goarch: arm64
            platform: darwin-arm64
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod

      - name: Format check
        working-directory: src
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt reported unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: src
        run: go vet ./...

      - name: Test
        working-directory: src
        run: go test ./...

      # 竞态检测需要 CGO 与 C 工具链，Windows/macOS 运行器不保证具备，故只在 Linux 上执行
      # Race detection needs CGO and a C toolchain, which Windows/macOS runners do not guarantee, so it runs on Linux only
      - name: Test (race)
        if: runner.os == 'Linux'
        working-directory: src
        run: go test -race ./...

      - name: Compute version
        id: version
        shell: bash
        run: |
          RAW=$(git describe --tags --always --long 2>/dev/null || echo "")
          if echo "$RAW" | grep -Eq '^.+-[0-9]+-g[a-f0-9]+$'; then
            VER=$(echo "$RAW" | sed -E 's/^(.+)-([0-9]+)-(g[a-f0-9]+)$/\1-beta\2-\3/')
          elif echo "$RAW" | grep -Eq '^[a-f0-9]+$'; then
            VER="0.0.0-beta0-g${RAW}"
          else
            VER="$RAW"
          fi
          echo "VERSION=${VER}" >> "$GITHUB_OUTPUT"
          echo "Computed version: ${VER}"

      - name: Build
        shell: bash
        run: |
          export CGO_ENABLED=0
          export GOOS=${{ matrix.goos }}
          export GOARCH=${{ matrix.goarch }}
          [ -n "${{ matrix.goarm }}" ] && export GOARM=${{ matrix.goarm }}

          cd src
          go build \
            -ldflags "-s -w -X main.version=${{ steps.version.outputs.VERSION }}" \
            -o ../dist/optiroute${{ matrix.ext }} \
            .

      - name: Rename binary
        shell: bash
        run: |
          mkdir -p dist
          mv dist/optiroute${{ matrix.ext }} \
             dist/OptiRoute-${{ steps.version.outputs.VERSION }}-${{ matrix.platform }}${{ matrix.ext }}

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cd dist
          zip ../OptiRoute-${{ steps.version.outputs.VERSION }}-${{ matrix.platform }}.zip \
            OptiRoute-${{ steps.version.outputs.VERSION }}-${{ matrix.platform }}${{ matrix.ext }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\OptiRoute-${{ steps.version.outputs.VERSION }}-${{ matrix.platform }}${{ matrix.ext }}" `
            -DestinationPath "OptiRoute-${{ steps.version.outputs.VERSION }}-${{ matrix.platform }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OptiRoute-${{ steps.version.outputs.VERSION }}-${{ matrix.platform }}
          path: OptiRoute-${{ steps.version.outputs.VERSION }}-${{ matrix.platform }}.zip

  # 独立作业：在 Linux 上交叉编译全部发布目标，验证交叉编译可用性（技术设计第 7 节）
  # Separate job: cross compile every release target on Linux to verify cross compilation (technical design section 7)
  crosscompile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod

      - name: Cross compile all release targets
        working-directory: src
        run: |
          set -euo pipefail
          export CGO_ENABLED=0
          crossbuild() {
            echo "building $1/$2${3:+/$3}"
            GOOS="$1" GOARCH="$2" GOARM="$3" go build -o /dev/null .
          }
          crossbuild windows amd64 ""
          crossbuild linux   amd64 ""
          crossbuild linux   arm64 ""
          crossbuild linux   arm   7
          crossbuild darwin  amd64 ""
          crossbuild darwin  arm64 ""
